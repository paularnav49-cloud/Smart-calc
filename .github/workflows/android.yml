name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add Groq API key
        run: printf 'groqApiKey=%s\n' "$GROQ_KEY" >> local.properties
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          {
            echo "## Build failure details"
            echo "```"
            grep -n -E "^e: |error:|ERROR|FAILURE|Caused by|> Task.*FAILED|Execution failed" build.log | head -100
            echo "```"
            echo "### Tail of log"
            echo "```"
            tail -80 build.log
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        if: success()
        run: mv app/build/outputs/apk/debug/app-debug.apk SmartCalc.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalc-debug-apk
          path: SmartCalc.apk

      - name: Create release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SmartCalc build ${{ github.run_number }}
          files: SmartCalc.apk
          make_latest: true
