name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add API keys
        run: |
          printf 'groqApiKey=%s\n' "${{ secrets.GROQ_API_KEY }}" >> local.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.log', 'utf8');
            const errLines = log.split('\n').filter(l => /(?:^e: |error:|FAILURE|Caused by|Execution failed|FAILED|resource linking|AAPT)/.test(l));
            const excerpt = (errLines.length ? errLines.slice(0, 60).join('\n') : log.split('\n').slice(-60).join('\n'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Build failed — error report',
              body: 'Build failed on commit ' + context.sha + '\n\n~~~\n' + excerpt + '\n~~~\n\nLast 60 lines:\n\n~~~\n' + log.split('\n').slice(-60).join('\n') + '\n~~~'
            });

      - name: Rename APK
        if: success()
        run: mv app/build/outputs/apk/debug/app-debug.apk SmartCalc.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalc-debug-apk
          path: SmartCalc.apk

      - name: Create release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SmartCalc build ${{ github.run_number }}
          files: SmartCalc.apk
          make_latest: true
